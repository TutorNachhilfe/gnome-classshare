<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4b5563">
  <title>Bild Annotieren</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <style>
    :root {
      --bg: #e8eaed;
      --surface: #fff;
      --toolbar-bg: #f8f9fa;
      --text: #202124;
      --text-secondary: #5f6368;
      --border: #dadce0;
      --accent: #1a73e8;
      --danger: #d93025;
      --shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --surface: #303134;
        --toolbar-bg: #292a2d;
        --text: #e8eaed;
        --text-secondary: #9aa0a6;
        --border: #5f6368;
        --accent: #8ab4f8;
        --danger: #f28b82;
        --shadow: 0 1px 3px rgba(0,0,0,.4);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    #toolbar {
      background: var(--toolbar-bg);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 12px;
      z-index: 100;
      box-shadow: var(--shadow);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #toolbar .sep {
      width: 1px; height: 28px;
      background: var(--border);
      margin: 0 4px;
    }
    #toolbar label {
      font-size: 13px; display: flex; align-items: center; gap: 4px;
      color: var(--text-secondary);
    }
    #toolbar input[type=color] {
      width: 36px; height: 28px;
      border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; background: none; padding: 3px;
    }
    #toolbar input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    #toolbar input[type=color]::-webkit-color-swatch { border-radius: 50%; border: none; }
    #toolbar button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      display: inline-flex; align-items: center; gap: 4px;
      transition: background .15s, border-color .15s;
    }
    #toolbar button:hover { background: var(--bg); }
    #toolbar button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    #toolbar button.danger { color: var(--danger); }
    #toolbar button.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    #toolbar button.save { background: var(--accent); color: #fff; border-color: var(--accent); }
    #toolbar button.save:hover { opacity: .9; }
    #stroke-widths {
      display: flex; align-items: center; gap: 2px;
    }
    #stroke-widths button {
      width: 34px; height: 28px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    #stroke-widths button svg { display: block; }
    #stroke-widths button.active svg line { stroke: #fff; }
    #status {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      display: flex; align-items: center; gap: 4px;
    }
    #status .dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    }
    #status .dot.online { background: #34a853; }
    #status .dot.offline { background: var(--danger); }

    #viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start; justify-content: center;
      padding: 12px;
    }
    .img-wrap {
      position: relative;
      display: inline-block;
      box-shadow: 0 2px 16px rgba(0,0,0,.2);
      border-radius: 4px;
      overflow: hidden;
      line-height: 0;
    }
    #image {
      display: block;
      max-width: min(900px, calc(100vw - 24px));
      height: auto;
    }
    #ann-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%; transform: translateX(-50%);
      background: #333;
      color: #fff;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      display: none; opacity: 0;
      z-index: 200;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
      transition: opacity .2s;
    }
    #toast.show { display: block; opacity: 1; }
    @media (prefers-color-scheme: dark) {
      #toast { background: #e8eaed; color: #202124; }
    }
    @media (max-width: 600px) {
      #toolbar { gap: 3px; padding: 6px 8px; }
      #toolbar button { padding: 5px 8px; font-size: 12px; }
      #toolbar .sep { margin: 0 2px; }
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <label><i class="ph-bold ph-palette"></i> <input type="color" id="colorPicker" value="#e11d48" title="Farbe"></label>
    <span id="stroke-widths">
      <button data-width="2" title="2 px"><svg width="20" height="8"><line x1="0" y1="4" x2="20" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button data-width="4" class="active" title="4 px"><svg width="20" height="8"><line x1="0" y1="4" x2="20" y2="4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button data-width="8" title="8 px"><svg width="20" height="8"><line x1="0" y1="4" x2="20" y2="4" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg></button>
      <button data-width="16" title="16 px"><svg width="20" height="8"><line x1="0" y1="4" x2="20" y2="4" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg></button>
    </span>
    <span class="sep"></span>
    <button id="btnPen"><i class="ph-bold ph-pencil"></i> Stift</button>
    <button id="btnEraser"><i class="ph-bold ph-eraser"></i> Radierer</button>
    <span class="sep"></span>
    <button id="btnUndo"><i class="ph-bold ph-arrow-counter-clockwise"></i></button>
    <button id="btnClear" class="danger"><i class="ph-bold ph-trash"></i></button>
    <button id="btnSave" class="save"><i class="ph-bold ph-floppy-disk"></i> Speichern</button>
    <span id="status">
      <span class="dot offline"></span>
      <span id="statusText">Verbinde…</span>
    </span>
  </div>

  <div id="viewport">
    <div class="img-wrap">
      <img id="image" alt="">
      <canvas id="ann-canvas"></canvas>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    'use strict';

    var params = new URLSearchParams(location.search);
    var imgId  = params.get('img') || '';
    var imgUrl = '/img-file?img=' + encodeURIComponent(imgId);

    var strokes = [];
    var currentStroke = null;
    var tool = 'none';
    var wsConn = null;

    var colorPicker = document.getElementById('colorPicker');
    var btnPen      = document.getElementById('btnPen');
    var btnEraser   = document.getElementById('btnEraser');
    var btnSave     = document.getElementById('btnSave');
    var statusText  = document.getElementById('statusText');
    var statusDot   = document.querySelector('#status .dot');
    var toastEl     = document.getElementById('toast');
    var strokeWidth = 4;
    var widthBtns   = document.querySelectorAll('#stroke-widths button');
    var annCanvas   = document.getElementById('ann-canvas');
    var ctx         = annCanvas.getContext('2d');
    var imageEl     = document.getElementById('image');

    function setStatus(msg, online) {
      statusText.textContent = msg;
      statusDot.className = 'dot ' + (online ? 'online' : 'offline');
    }

    var toastTimer;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 2800);
    }

    // ── Tool selection ──────────────────────────────────────────────────────
    btnPen.addEventListener('click', function() {
      if (tool !== 'pen' && tool !== 'eraser') setTool('pen');
      else if (tool === 'pen') setTool('eraser');
      else setTool('none');
    });
    btnEraser.addEventListener('click', function() {
      setTool(tool === 'eraser' ? 'none' : 'eraser');
    });

    function setTool(t) {
      tool = t;
      btnPen.classList.toggle('active', tool === 'pen');
      btnEraser.classList.toggle('active', tool === 'eraser');
      var active = (tool === 'pen' || tool === 'eraser');
      annCanvas.style.pointerEvents = active ? 'auto' : 'none';
      annCanvas.style.touchAction = active ? 'none' : 'pan-x pan-y pinch-zoom';
    }

    setTool('pen');

    widthBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        widthBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        strokeWidth = parseInt(btn.dataset.width, 10);
      });
    });

    document.getElementById('btnUndo').addEventListener('click', function() {
      if (!strokes.length) return;
      strokes.pop();
      redrawAll();
      saveAnnotations();
      wsSend({ type: 'undo' });
      showToast('Rückgängig');
    });

    document.getElementById('btnClear').addEventListener('click', function() {
      if (!strokes.length) return;
      if (!confirm('Alle Annotationen löschen?')) return;
      strokes = [];
      redrawAll();
      saveAnnotations();
      wsSend({ type: 'clear' });
      showToast('Alles gelöscht');
    });

    btnSave.addEventListener('click', function() {
      if (!annCanvas.width) return;
      var link = document.createElement('a');
      link.download = 'annotiert.png';
      link.href = annCanvas.toDataURL('image/png');
      link.click();
      showToast('Bild gespeichert');
    });

    // ── Drawing ─────────────────────────────────────────────────────────────
    var drawing = false;

    function canvasPt(e) {
      var r  = annCanvas.getBoundingClientRect();
      var sx = annCanvas.width  / r.width;
      var sy = annCanvas.height / r.height;
      return [(e.clientX - r.left) * sx, (e.clientY - r.top) * sy];
    }

    function down(e) {
      if (tool === 'none') return;
      drawing = true;
      annCanvas.setPointerCapture(e.pointerId);
      var pt = canvasPt(e);
      if (tool === 'pen') {
        currentStroke = {
          color: colorPicker.value,
          width: strokeWidth,
          points: [pt],
        };
      } else {
        eraseAt(pt);
      }
    }

    function move(e) {
      if (!drawing) return;
      var events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (var j = 0; j < events.length; j++) {
        var ev = events[j];
        var pt = canvasPt(ev);
        if (tool === 'pen' && currentStroke) {
          currentStroke.points.push(pt);
          var pts = currentStroke.points;
          if (pts.length >= 2) {
            ctx.beginPath();
            ctx.strokeStyle = currentStroke.color;
            ctx.lineWidth   = currentStroke.width;
            ctx.lineCap     = 'round';
            ctx.lineJoin    = 'round';
            ctx.moveTo(pts[pts.length - 2][0], pts[pts.length - 2][1]);
            ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
            ctx.stroke();
          }
        } else if (tool === 'eraser') {
          eraseAt(pt);
        }
      }
    }

    function up(e) {
      if (!drawing) return;
      drawing = false;
      if (tool === 'pen' && currentStroke && currentStroke.points.length >= 2) {
        strokes.push(currentStroke);
        wsSend({ type: 'stroke', stroke: currentStroke });
        saveAnnotations();
      } else if (tool === 'eraser') {
        wsSend({ type: 'sync', strokes: strokes });
        saveAnnotations();
      }
      currentStroke = null;
    }

    function cancel(e) {
      if (!drawing) return;
      drawing = false;
      if (tool === 'pen' && currentStroke && currentStroke.points.length >= 2) {
        strokes.push(currentStroke);
        wsSend({ type: 'stroke', stroke: currentStroke });
        saveAnnotations();
      }
      currentStroke = null;
      annCanvas.releasePointerCapture(e.pointerId);
    }

    annCanvas.addEventListener('pointerdown', down);
    annCanvas.addEventListener('pointermove', move);
    annCanvas.addEventListener('pointerup', up);
    annCanvas.addEventListener('pointercancel', cancel);

    function eraseAt(pt) {
      var ex = pt[0], ey = pt[1];
      var R = 20;
      var before = strokes.length;
      strokes = strokes.filter(function(s) {
        return !s.points.some(function(p) {
          var dx = p[0] - ex, dy = p[1] - ey;
          return dx * dx + dy * dy < R * R;
        });
      });
      if (strokes.length !== before) redrawAll();
    }

    function drawStroke(s) {
      if (s.points.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = s.color;
      ctx.lineWidth   = s.width;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      ctx.moveTo(s.points[0][0], s.points[0][1]);
      for (var i = 1; i < s.points.length; i++) {
        ctx.lineTo(s.points[i][0], s.points[i][1]);
      }
      ctx.stroke();
    }

    function redrawAll() {
      ctx.clearRect(0, 0, annCanvas.width, annCanvas.height);
      strokes.forEach(function(s) { drawStroke(s); });
    }

    // ── WebSocket ──────────────────────────────────────────────────────────
    function connectWS() {
      if (!imgId) return;
      var scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      wsConn = new WebSocket(scheme + '://' + location.host + '/ws/annotate-img?img=' + encodeURIComponent(imgId));
      wsConn.onopen  = function() { setStatus('Verbunden', true); };
      wsConn.onclose = function() {
        setStatus('Getrennt – reconnect…', false);
        wsConn = null;
        setTimeout(connectWS, 2000);
      };
      wsConn.onmessage = function(e) {
        try {
          var msg = JSON.parse(e.data);
          if (msg.type === 'stroke' && msg.stroke) {
            strokes.push(msg.stroke);
            drawStroke(ctx, msg.stroke);
          } else if (msg.type === 'undo') {
            strokes.pop();
            redrawAll();
          } else if (msg.type === 'clear') {
            strokes = [];
            redrawAll();
          } else if (msg.type === 'sync' && Array.isArray(msg.strokes)) {
            strokes = msg.strokes;
            redrawAll();
          }
        } catch (_) {}
      };
    }

    function wsSend(obj) {
      if (wsConn && wsConn.readyState === WebSocket.OPEN) {
        wsConn.send(JSON.stringify(obj));
      }
    }

    // ── Persistence ────────────────────────────────────────────────────────
    async function loadAnnotations() {
      try {
        var r = await fetch('/api/annotations?img=' + encodeURIComponent(imgId));
        if (!r.ok) return;
        var data = await r.json();
        strokes = data.strokes || [];
        redrawAll();
      } catch (_) {}
    }

    async function saveAnnotations() {
      if (!imgId) return;
      try {
        await fetch('/api/annotations?img=' + encodeURIComponent(imgId), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ strokes: strokes }),
        });
      } catch (_) {}
    }

    // ── Load image ─────────────────────────────────────────────────────────
    if (!imgId) {
      setStatus('Kein Bild angegeben', false);
    } else {
      setStatus('Lade Bild…', false);
      imageEl.onload = function() {
        annCanvas.width  = imageEl.naturalWidth;
        annCanvas.height = imageEl.naturalHeight;
        annCanvas.style.pointerEvents = 'auto';
        annCanvas.style.touchAction = 'none';
        setStatus('Bereit', true);
        loadAnnotations();
        connectWS();
      };
      imageEl.onerror = function() {
        setStatus('Bild konnte nicht geladen werden', false);
        showToast('Bild nicht gefunden');
      };
      imageEl.src = imgUrl;
    }
  </script>
</body>
</html>

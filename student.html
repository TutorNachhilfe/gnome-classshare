<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__APP_NAME__</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #f5f5f5;
      --text: #1a1a1a;
      --accent: #0066cc;
      --border: #e0e0e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --card: #2d2d2d;
        --text: #f0f0f0;
        --accent: #4da6ff;
        --border: #444444;
      }
      .logo { filter: invert(1); }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Login screen ── */
    #login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
    }
    .card h1 { margin: 0 0 1rem 0; font-size: clamp(1.8rem, 6vw, 2.5rem); }
    .name-input {
      width: 100%;
      padding: 1rem;
      font-size: clamp(1rem, 4vw, 1.4rem);
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-bottom: .75rem;
    }
    .login-btn {
      width: 100%;
      padding: 1rem;
      border: 0;
      border-radius: 14px;
      font-size: clamp(1rem, 4vw, 1.3rem);
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .error { color: #e11d48; font-weight: 700; margin: .25rem 0 .75rem 0; font-size: .95rem; }

    /* ── Student screen ── */
    #student-screen {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: .75rem;
      gap: .75rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: .75rem 1rem;
      flex-shrink: 0;
      gap: .75rem;
    }
    .brand { font-weight: 700; font-size: 1.05rem; }
    .logo { height: 1.4em; width: auto; vertical-align: middle; margin-right: .3rem; border-radius: 3px; }
    .who { display: flex; align-items: center; gap: .5rem; }
    .logout {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 10px;
      padding: .35rem .55rem;
      cursor: pointer;
      font-size: .95rem;
    }
    .main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      gap: .75rem;
    }
    .dropzone-area {
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: .8rem;
    }
    .drop {
      border: 2px dashed var(--border);
      border-radius: 12px;
      text-align: center;
      padding: 1.4rem .8rem;
      background: var(--bg);
      cursor: pointer;
    }
    .choose {
      margin-top: .7rem;
      border: 0;
      border-radius: 10px;
      padding: .55rem .8rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .file-list-area {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      min-height: 0;
    }
    .file-list-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: .6rem;
      display: flex;
      flex-direction: column;
      gap: .45rem;
    }
    .row {
      display: flex;
      align-items: center;
      gap: .45rem;
      padding: .65rem .75rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      min-height: 48px;
    }
    .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .meta {
      font-size: .84rem;
      opacity: .75;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding: .35rem .55rem;
      text-decoration: none;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      flex-shrink: 0;
    }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    #toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 1rem;
      background: var(--text);
      color: var(--bg);
      border-radius: 10px;
      padding: .65rem .9rem;
      display: none;
      z-index: 20;
      max-width: min(92vw, 560px);
    }
    @media (max-width: 480px) {
      .wrap { padding: .5rem; gap: .5rem; }
      .drop { padding: 1rem .6rem; }
      .meta { display: none; }
    }
    @media (min-width: 481px) and (max-width: 768px) {
      .wrap { padding: .6rem; gap: .6rem; }
    }
    @media (orientation: landscape) and (max-width: 1024px) {
      .main-content { flex-direction: row; }
      .dropzone-area { width: 40%; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; }
      .file-list-area { flex: 1; width: 60%; }
    }
    @media (min-width: 1025px) {
      .row { padding: .55rem .75rem; }
    }
  </style>
</head>
<body>

  <!-- Login screen -->
  <div id="login-screen">
    <main class="card">
      <h1>&#x1F464; Dein Name</h1>
      <p id="login-error" class="error" style="display:none"></p>
      <form id="login-form">
        <input id="name-input" class="name-input" type="text"
               autocomplete="name" placeholder="Vorname Nachname" required autofocus>
        <button class="login-btn" type="submit">Weiter &#x2192;</button>
      </form>
    </main>
  </div>

  <!-- Student screen -->
  <div id="student-screen" style="display:none">
    <div id="toast"></div>
    <div class="wrap">
      <div class="header">
        <div class="brand">__BRAND_HTML__</div>
        <div class="who">&#x1F464; <span id="current-name"></span>
          <button id="logout" class="logout">&#x21A9;&#xFE0F;</button></div>
      </div>
      <div class="main-content">
        <div class="dropzone-area">
          <div id="dropzone" class="drop">
            <div>&#x1F4E4; Datei hierher ziehen</div>
            <button id="choose" class="choose" type="button">oder Datei w&#xE4;hlen</button>
            <input id="file-input" type="file" name="files" multiple hidden>
          </div>
        </div>
        <div class="file-list-area">
          <div id="file-list" class="file-list-scroll"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'classshare_name';

    const toast = document.getElementById('toast');
    const fileList = document.getElementById('file-list');
    let allFiles = [];
    let currentName = '';
    let wsConn = null;

    function showToast(text) {
      toast.textContent = text;
      toast.style.display = 'block';
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => { toast.style.display = 'none'; }, 3200);
    }

    function showLoginScreen() {
      document.getElementById('login-screen').style.display = 'grid';
      document.getElementById('student-screen').style.display = 'none';
    }

    function showStudentScreen(name) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('student-screen').style.display = 'flex';
      document.getElementById('current-name').textContent = name;
      currentName = name;
      loadFiles();
      connectWebSocket();
    }

    // Check localStorage on load
    (function init() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        showStudentScreen(stored);
      } else {
        showLoginScreen();
      }
    })();

    // Login
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const nameInput = document.getElementById('name-input');
      const errorEl = document.getElementById('login-error');
      const name = nameInput.value.trim();
      errorEl.style.display = 'none';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: name})
        });
        const data = await response.json();
        if (data.ok) {
          localStorage.setItem(STORAGE_KEY, data.name);
          showStudentScreen(data.name);
        } else {
          errorEl.textContent = data.error || 'Fehler beim Anmelden';
          errorEl.style.display = 'block';
        }
      } catch (_) {
        errorEl.textContent = 'Verbindungsfehler';
        errorEl.style.display = 'block';
      }
    });

    // Logout
    document.getElementById('logout').addEventListener('click', function() {
      localStorage.removeItem(STORAGE_KEY);
      currentName = '';
      if (wsConn) { wsConn.close(); wsConn = null; }
      location.reload();
    });

    function renderRow(file) {
      const row = document.createElement('div');
      row.className = 'row';

      const icon = file.scope === 'received' ? '\u{1F4E5}' : '\u{1F4E4}';
      const ack = file.scope === 'sent' ? '\u2705\u00a0' : '';

      const nameDiv = document.createElement('div');
      nameDiv.className = 'name';
      nameDiv.textContent = icon + '\u00a0' + file.filename;

      const metaDiv = document.createElement('div');
      metaDiv.className = 'meta';
      metaDiv.textContent = ack + file.size_human + ' \u00b7 ' + file.timestamp;

      row.appendChild(nameDiv);
      row.appendChild(metaDiv);

      if (file.view) {
        const viewBtn = document.createElement('a');
        viewBtn.className = 'btn btn-ghost';
        viewBtn.href = file.view;
        viewBtn.target = '_blank';
        viewBtn.rel = 'noopener noreferrer';
        viewBtn.title = 'Anzeigen';
        viewBtn.textContent = '\u{1F441}\uFE0F';
        row.appendChild(viewBtn);
      }

      if (file.filename.toLowerCase().endsWith('.pdf') && file.download) {
        const pdfId = file.pdf_id || btoa(file.download).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const annBtn = document.createElement('a');
        annBtn.className = 'btn btn-ghost';
        annBtn.href = '/annotate?pdf=' + pdfId;
        annBtn.target = '_blank';
        annBtn.rel = 'noopener noreferrer';
        annBtn.title = 'Annotieren';
        annBtn.textContent = '\u{1F4DD} Annotieren';
        row.appendChild(annBtn);
      }

      const dlBtn = document.createElement('a');
      dlBtn.className = 'btn';
      dlBtn.href = file.download;
      dlBtn.title = 'Herunterladen';
      dlBtn.textContent = '\u2B07\uFE0F';
      row.appendChild(dlBtn);

      return row;
    }

    function renderFiles() {
      fileList.replaceChildren();
      allFiles.forEach(function(file) { fileList.appendChild(renderRow(file)); });
    }

    function updateFiles(data) {
      allFiles = (data.received || [])
        .map(function(f) { return Object.assign({}, f, {scope: 'received'}); })
        .concat(
          (data.sent || [])
            .map(function(f) { return Object.assign({}, f, {scope: 'sent'}); })
        )
        .sort(function(a, b) { return (b.mtime || 0) - (a.mtime || 0); });
      renderFiles();
    }

    async function loadFiles() {
      if (!currentName) return;
      try {
        const response = await fetch('/api/files?name=' + encodeURIComponent(currentName), {cache: 'no-store'});
        if (!response.ok) return;
        updateFiles(await response.json());
      } catch (_) {}
    }

    async function uploadFiles(files) {
      if (!files || files.length === 0 || !currentName) return;
      const body = new FormData();
      for (const file of files) body.append('files', file);
      try {
        const response = await fetch('/upload?name=' + encodeURIComponent(currentName), {method: 'POST', body: body});
        if (!response.ok) {
          showToast('Upload fehlgeschlagen');
          return;
        }
        await loadFiles();
        showToast('\u2705 Datei hochgeladen');
      } catch (_) {
        showToast('Upload fehlgeschlagen');
      }
    }

    const fileInput = document.getElementById('file-input');
    const dropzone = document.getElementById('dropzone');

    document.getElementById('choose').addEventListener('click', function() { fileInput.click(); });
    fileInput.addEventListener('change', function() { uploadFiles(fileInput.files); });

    dropzone.addEventListener('dragover', function(event) {
      event.preventDefault();
      dropzone.style.borderColor = 'var(--accent)';
    });
    dropzone.addEventListener('dragleave', function() {
      dropzone.style.borderColor = 'var(--border)';
    });
    dropzone.addEventListener('drop', function(event) {
      event.preventDefault();
      dropzone.style.borderColor = 'var(--border)';
      uploadFiles(event.dataTransfer.files);
    });

    function connectWebSocket() {
      if (!currentName) return;
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      wsConn = new WebSocket(scheme + '://' + location.host + '/ws?name=' + encodeURIComponent(currentName));
      wsConn.onmessage = function(event) {
        try {
          const payload = JSON.parse(event.data);
          if (payload.type === 'new_file') {
            showToast('\u{1F4C4} Neue Datei von Tutor: ' + payload.filename);
          }
          if (payload.type === 'file_list') {
            updateFiles(payload);
          }
        } catch (_) {}
      };
      wsConn.onclose = function() {
        wsConn = null;
        if (currentName) setTimeout(connectWebSocket, 1500);
      };
    }
  </script>
</body>
</html>
